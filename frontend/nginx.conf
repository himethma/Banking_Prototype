worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  # Keycloak owns the CSP for its HTML pages because its login and required-
  # action templates use per-response nonces. Applying the SPA CSP to /auth/
  # would combine both policies and block Keycloak's initialization scripts.
  map $uri $frontend_csp {
    ~^/auth/ "";
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  }

  log_format security escape=json '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_id":"$request_id"}';
  access_log /dev/stdout security;
  error_log /dev/stderr warn;

  upstream api_pool {
    least_conn;
    server api-a:8443 max_fails=3 fail_timeout=10s;
    server api-b:8443 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8080;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    server_name frontend;
    ssl_protocols TLSv1.3;
    ssl_certificate /certs/frontend.crt;
    ssl_certificate_key /certs/frontend.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $frontend_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass https://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_ssl_certificate /certs/frontend.crt;
      proxy_ssl_certificate_key /certs/frontend.key;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_name api;
      proxy_ssl_server_name on;
    }

    location /auth/ {
      proxy_pass https://keycloak:8443;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_certificate /certs/frontend.crt;
      proxy_ssl_certificate_key /certs/frontend.key;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_name keycloak;
      proxy_ssl_server_name on;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
