# PostHog uses JSON-valued, dynamically named cookies on the shared localhost
# domain. The banking application does not consume these analytics cookies.
# Exclude only those cookie values from SQLi rules; all other variables and
# every other CRS rule category remain inspected.
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:/^ph_phc_[A-Za-z0-9]+_posthog$/"
